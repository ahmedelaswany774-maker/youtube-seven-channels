name: Kombo City Factory

on:
  workflow_dispatch:
  schedule:
    # Cairo is UTC+2 in winter and UTC+3 in summer.
    # Run at both candidate UTC hours; Python proceeds only at 08:00 Africa/Cairo.
    - cron: "0 5,6 * * *"

permissions:
  contents: write

concurrency:
  group: kombo-city-factory-daily
  cancel-in-progress: false

jobs:
  build-one-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kombo-city-factory
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kombo-city-factory/requirements.txt

      - name: Install and verify media tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              echo "Installing FFmpeg (attempt $attempt/3)"
              if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not install FFmpeg/FFprobe after 3 attempts."
                exit 1
              fi
              sleep 5
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Generate and validate one video
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY in Actions secrets."; exit 1; }
          test -n "$FISH_API_KEY" || { echo "::error::Add FISH_API_KEY in Actions secrets."; exit 1; }
          test -n "$FISH_VOICE_ID" || { echo "::error::Add FISH_VOICE_ID in Actions secrets."; exit 1; }
          python main.py --one ${{ github.event_name == 'schedule' && '--scheduled-guard' || '' }}

      - name: Upload video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kombo-city-video-${{ github.run_number }}
          path: |
            ${{ steps.build.outputs.video }}
            ${{ steps.build.outputs.metadata }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated video and used-idea ledger
        if: success()
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kombo-city-factory/used.txt kombo-city-factory/output/
          if git diff --cached --quiet; then
            echo "No generated output to commit."
          else
            git commit -m "chore(kombo): generate daily educational short"
            git push
          fi
